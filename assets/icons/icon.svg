<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="35%" stop-color="#9df2ff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#35e0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35e0ff" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#35e0ff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#35e0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#04070d"/>
  <circle cx="256" cy="256" r="250" fill="url(#bloom)"/>

  <!-- outer tick ring -->
  <g stroke="#35e0ff" fill="none">
    <circle cx="256" cy="256" r="178" stroke-opacity=".28" stroke-width="3"/>
    <circle cx="256" cy="256" r="152" stroke-opacity=".55" stroke-width="6"
            stroke-dasharray="34 26"/>
    <circle cx="256" cy="256" r="120" stroke-opacity=".22" stroke-width="3"/>
    <circle cx="256" cy="256" r="96" stroke-opacity=".85" stroke-width="7"
            stroke-dasharray="150 452" transform="rotate(-38 256 256)"/>
    <circle cx="256" cy="256" r="66" stroke-opacity=".45" stroke-width="3"/>
  </g>

  <!-- core -->
  <circle cx="256" cy="256" r="86" fill="url(#core)"/>
  <circle cx="256" cy="256" r="34" fill="none" stroke="#35e0ff" stroke-width="5" stroke-opacity=".95"/>
  <circle cx="256" cy="256" r="17" fill="#eafcff"/>
</svg>
